<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advanced Java PC Assistant</title>
    <style>
        :root {
            --bg-color: #0b1020;
            --surface-color: #151c33;
            --surface-hover: #1e2846;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #e8ecf5;
            --text-muted: #94a3b8;
            --border-color: #2a365c;
            --success: #22c55e;
            --danger: #ef4444;
            --listening-red: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: clamp(16px, 4vw, 24px);
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            gap: 20px;
            padding-bottom: 90px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .terminal {
            background-color: #060913;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 200px;
            overflow-y: auto;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-line {
            line-height: 1.5;
            word-break: break-all;
        }

        .log-info { color: var(--text-muted); }
        .log-success { color: var(--success); }
        .log-cmd { color: var(--accent-color); font-weight: bold; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 720px) {
            .controls-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .btn {
            background-color: var(--surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            min-height: 54px;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #060913;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            min-height: 52px;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-weight: 600;
            font-size: 16px;
            min-height: 52px;
            cursor: pointer;
        }

        .mic-btn {
            background-color: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .mic-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--text-main);
        }

        .mic-btn.listening {
            background-color: var(--listening-red);
            border-color: var(--listening-red);
            animation: pulse-mic 1.5s infinite;
        }

        .mic-btn.listening svg {
            fill: white;
        }

        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .status-banner {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            color: var(--accent-color);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .status-banner.active {
            display: flex;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="status-dot"></div>
            <h1>Java PC Assistant</h1>
        </div>
        <div style="font-size: 13px; color: var(--text-muted);">PC Engine: Ready</div>
    </header>

    <div class="container">
        <!-- Terminal Output -->
        <div class="card">
            <div class="section-title">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 14H7v-2h8v2zm3-4H7v-2h11v2zm0-4H7V8h11v2z"/></svg>
                Execution Log
            </div>
            <div class="terminal" id="terminal">
                <div class="log-line log-info">[System] Advanced Java PC Assistant initialized.</div>
                <div class="log-line log-success">[Ready] Listening for voice or text commands...</div>
            </div>
        </div>

        <!-- Listening Status Indicator -->
        <div class="status-banner" id="statusBanner">
            <span style="display:inline-block; width:8px; height:8px; background:var(--listening-red); border-radius:50%; animation: pulse-mic 1s infinite;"></span>
            <span id="statusText">Listening to your command... Speak clearly into your mic.</span>
        </div>

        <!-- Quick Controls -->
        <div class="card">
            <div class="section-title">Quick Actions</div>
            <div class="controls-grid">
                <button class="btn" onclick="sendCommand('open browser')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    Open Browser
                </button>
                <button class="btn" onclick="sendCommand('open notepad')">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    Open Notepad
                </button>
                <button class="btn" onclick="sendCommand('lock pc')">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    Lock PC
                </button>
                <button class="btn" onclick="sendCommand('system status')">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                    Sys Status
                </button>
            </div>
        </div>

        <!-- Input Bar with Mic -->
        <div class="card" style="padding: 12px;">
            <div class="input-group">
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice Input">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.23 14.47 16 12 16s-4.52-1.77-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.77 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                </button>
                <input type="text" id="commandInput" placeholder="Type or speak a command..." onkeydown="if(event.key === 'Enter') submitInput()">
                <button class="send-btn" onclick="submitInput()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('commandInput');
        const micBtn = document.getElementById('micBtn');
        const statusBanner = document.getElementById('statusBanner');
        const statusText = document.getElementById('statusText');

        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                statusBanner.classList.add('active');
                statusText.textContent = "Listening... Speak your command now.";
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    commandInput.value = finalTranscript;
                    submitInput();
                } else if (interimTranscript) {
                    commandInput.value = interimTranscript;
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                stopListening();
                appendLog("[Voice] Error: " + event.error, "info");
            };

            recognition.onend = () => {
                stopListening();
            };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert("Speech recognition is not supported in your browser. Please use Chrome or Edge.");
                return;
            }

            if (isListening) {
                recognition.stop();
                stopListening();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            statusBanner.classList.remove('active');
        }

        function submitInput() {
            const val = commandInput.value.trim();
            if (!val) return;
            sendCommand(val);
            commandInput.value = '';
        }

        function sendCommand(cmd) {
            appendLog(`> Executing: ${cmd}`, 'cmd');
            setTimeout(() => {
                let reply = `Successfully executed command: "${cmd}"`;
                if (cmd.includes('open browser')) reply = 'Launched default web browser on PC.';
                else if (cmd.includes('open notepad')) reply = 'Opened Notepad application.';
                else if (cmd.includes('lock pc')) reply = 'PC security lock engaged.';
                else if (cmd.includes('system status')) reply = 'CPU: 14% | RAM: 4.2GB / 16GB | Java Engine Active';
                
                appendLog(`[PC Engine] ${reply}`, 'success');
            }, 300);
        }

        function appendLog(text, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-line log-${type}`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
